name: Update Dev.to Blogs

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  update-blogs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch latest DEV.to blogs
        run: node src/scripts/fetchBlogs.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/blogs.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated blogs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/blogs.json
          git commit -m "chore: update Dev.to blogs"
          git push origin master
