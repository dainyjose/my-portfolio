name: Update Dev.to Blogs

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  update-blogs:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch latest DEV.to blogs
        run: node src/scripts/fetchBlogs.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/blogs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create/update automation branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git checkout -B automation/update-devto-blogs

      - name: Commit updated blogs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Dainy Jose"
          git config user.email "dainyjose.mary@gmail.com"

          git add src/data/blogs.json
          git commit -m "chore: update Dev.to blogs"

      - name: Push automation branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin automation/update-devto-blogs

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base master \
            --head automation/update-devto-blogs \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base master \
              --head automation/update-devto-blogs \
              --title "chore: update Dev.to blogs" \
              --body "Automated update of Dev.to blog data."
          else
            echo "Existing PR #$PR_NUMBER found. Updating it."
          fi

